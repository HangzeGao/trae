apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: tpm-crypto
spec:
  clusterIP: None  # headless
  ports:
    - name: client
      port: 2379
      targetPort: 2379
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: tpm-crypto
spec:
  serviceName: etcd
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.13
          args:
            - "/usr/local/bin/etcd"
            - "--name=$(POD_NAME)"
            - "--data-dir=/var/run/etcd"
            - "--listen-client-urls=http://0.0.0.0:2379"
            - "--advertise-client-urls=http://$(POD_NAME).etcd.tpm-crypto.svc.cluster.local:2379"
            - "--listen-peer-urls=http://0.0.0.0:2380"
            - "--initial-advertise-peer-urls=http://$(POD_NAME).etcd.tpm-crypto.svc.cluster.local:2380"
            - "--initial-cluster=$(POD_NAME)=http://$(POD_NAME).etcd.tpm-crypto.svc.cluster.local:2380"
            - "--initial-cluster-token=etcd-cluster"
            - "--initial-cluster-state=new"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
