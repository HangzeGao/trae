apiVersion: v1
kind: Service
metadata:
  name: {{ include "tpm-crypto-service.fullname" . }}
  labels:
    {{- include "tpm-crypto-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      appProtocol: grpc
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      appProtocol: http
  selector:
    {{- include "tpm-crypto-service.selectorLabels" . | nindent 4 }}
